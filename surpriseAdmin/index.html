<!DOCTYPE html>
<html lang="fr">

<head>
  <title>Itération surprise ADMIN</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/base.css" />
</head>

<body>
  <section id="log"></section>

  <section id="newMovie"></section>

  <section id="addProfile"></section>

  <section id="editProfile"></section>

  <script type="module">
    import { Log } from "./component/Log/script.js";
    import { NewMovieForm } from "./component/NewMovieForm/script.js";
    import { ProfileForm } from "./component/AddProfileForm/script.js";
    import { EditProfileForm } from "./component/EditProfileForm/script.js";

    import { DataMovie } from "./data/dataMovie.js";
    import { DataProfile } from "./data/dataProfile.js";

    let movies = await DataMovie.requestCategories();

    window.C = {};

    C.handlerMovieUpdate = async function () {

      let form = document.querySelector('.new-movie__form');

      if (!form.reportValidity()) {
        V.renderLog("Erreur : Veuillez remplir correctement tous les champs.");
        form.reportValidity();
        return;
      };

      let fdata = new FormData(form);
      V.renderLog("Ajout du film en cours...");
      // Attend la réponse de la fonction `DataMovie.update(fd)`
      let res = await DataMovie.update(fdata);
      V.renderLog(res);
    };

    C.handlerProfileUpdate = async function () {

      let form = document.querySelector('.add-profile__form');

      if (!form.reportValidity()) {
        V.renderLog("Erreur : Veuillez remplir correctement tous les champs.");
        form.reportValidity();
        return;
      };

      let fdata = new FormData(form);
      V.renderLog("Ajout du profil en cours...");
      // Attend la réponse de la fonction `DataMProfile.update(fd)`
      let res = await DataProfile.update(fdata);
      V.renderLog(res);
    };

    C.handlerProfileSelect = async function (id) {
      if (id === "") return;
      let profiles = await DataProfile.requestProfiles();
      let profile = profiles.find(p => p.id == id);
      if (profile) {
        document.querySelector('#edit-profile-id').value = profile.id;
        document.querySelector('#edit-profile-name').value = profile.name;
        document.querySelector('#edit-profile-avatar').value = profile.avatar;
        document.querySelector('#edit-profile-age').value = profile.age;
        document.querySelector('#edit-profile-form').style.display = "block";
      };
    };

    C.handlerEditProfile = async function () {

      let form = document.querySelector('#edit-profile-form');

      if (!form.reportValidity()) {
        V.renderLog("Erreur : Veuillez remplir correctement tous les champs.");
        form.reportValidity();
        return;
      };

      let fdata = new FormData(form);
      V.renderLog("Modificatiion du profil en cours...");
      // Attend la réponse de la fonction `DataMProfile.update(fd)`
      let res = await DataProfile.editProfile(fdata);
      V.renderLog(res);
    };

    C.start = async function () {
      V.renderLog("Démarrage de l'application");
      V.renderNewMovieForm(movies, "C.handlerMovieUpdate()");
      V.renderProfileForm("C.handlerProfileUpdate()")
      let profiles = await DataProfile.requestProfiles();
      V.renderEditProfileForm(profiles, "C.handlerEditProfile()");
    }

    window.V = {};

    V.renderLog = function (txt) {
      let content = document.querySelector("#log");
      content.innerHTML = Log.format(txt);
    };

    V.renderNewMovieForm = function (data, handler) {
      let content = document.querySelector('#newMovie');
      content.innerHTML = NewMovieForm.format(data, handler);
    }

    V.renderProfileForm = function (handler) {
      let content = document.querySelector('#addProfile');
      content.innerHTML = ProfileForm.format(handler);
    }

    V.renderEditProfileForm = function (profiles, handler) {
      let content = document.querySelector('#editProfile');
      content.innerHTML = EditProfileForm.format(profiles, handler);
    }

    C.start();
  </script>
</body>
</html>
