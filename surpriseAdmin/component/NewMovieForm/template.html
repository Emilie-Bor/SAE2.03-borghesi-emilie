<section class="new-movie">
    <h1 class="new-movie__title">✧˖°.☆ﾟ°˖ Ajouter un film ˖°ﾟ☆.°˖✧</h1>
    <form class="new-movie__form">
        <input class="new-movie__input" type="text" name="title" placeholder="Titre du film" required>
        <input class="new-movie__input" type="text" name="director" placeholder="Réalisateur du film" title="Les nombres ne sont pas autorisés." required>
        <input class="new-movie__input" type="number" name="year" placeholder="Année de sortie" title="Les lettres ne sont pas autorisées." min="1900" max="2026" required>
        <input class="new-movie__input" type="number" name="length" placeholder="Durée (en minutes)" title="Les lettres ne sont pas autorisées." min="1" required>
        <input class="new-movie__input" type="text" name="description" placeholder="Synopsis du film" title="Veuillez saisir un synopsis valide." required>
        <select name="category" required>
            <option value="">~ Sélectionnez une catégorie ~</option>
            {{categoriesMovie}}
        </select>
        <input class="new-movie__input" type="text" name="image" placeholder="Nom du fichier de l'affiche" required>
        <input class="new-movie__input" type="text" name="url" placeholder="URL youtube du trailer" required>
        <select name="min_age" required>
            <option value="">~ Sélectionnez une limitation d'âge ~</option>
            <option value="0">Tout public</option>
            <option value="10">Déconseillé aux moins de 10 ans</option>
            <option value="12">Interdit au moins de 12 ans</option>
            <option value="16">Interdit au moins de 16 ans</option>
            <option value="18">Interdit au moins de 18 ans</option>
        </select>
        
        <input class="new-movie__btn" onclick="{{handler}}" type="button" value="Mettre à jour" name="todo">

    </form>
</section>
